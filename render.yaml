services:
  - type: web
    name: ombala-kisul
    runtime: node
    plan: free
    buildCommand: npm install && export BROWSERSLIST_CONFIG=".browserslistrc" && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.20.2
      - key: TZ
        value: Africa/Luanda
      - key: NEXT_PUBLIC_APP_DOMAIN
        value: www.ombalakisul.com
