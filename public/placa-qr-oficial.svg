<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <style>
      .font-sans { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background Signboard -->
  <rect x="20" y="20" width="760" height="560" rx="24" fill="#FFFFFF" stroke="#A61413" stroke-width="8" filter="url(#shadow)" />
  <rect x="36" y="36" width="728" height="528" rx="16" fill="none" stroke="#E2E8F0" stroke-width="2" />

  <!-- Top Red Corporate Header -->
  <path d="M 28 44 C 28 35.163 35.163 28 44 28 L 756 28 C 764.837 28 772 35.163 772 44 L 772 140 L 28 140 Z" fill="#A61413" />

  <!-- Logo and Header Text -->
  <g transform="translate(60, 48)">
    <!-- Stylized OK Logo Icon -->
    <path d="M 25 15 L 45 3 C 48 1 52 1 55 3 L 75 15" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
    <circle cx="50" cy="50" r="22" fill="none" stroke="#FFFFFF" stroke-width="9" />
    <path d="M 66 32 L 88 56 M 86 44 L 68 68" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" />

    <!-- Brand Typography -->
    <text x="110" y="42" fill="#FFFFFF" font-size="28" font-weight="900" letter-spacing="1" class="font-sans">OMBALA KISUL</text>
    <text x="110" y="66" fill="#FEE2E2" font-size="14" font-weight="700" letter-spacing="2" class="font-sans">SANEAMENTO BÁSICO &amp; LIMPEZA URBANA</text>
    <text x="110" y="86" fill="#FECACA" font-size="11" font-weight="600" class="font-sans">ONDJIVA • CUANHAMA • PROVÍNCIA DO CUNENE</text>
  </g>

  <!-- Title Section -->
  <g transform="translate(60, 185)">
    <rect x="0" y="0" width="680" height="42" rx="8" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5" />
    <text x="340" y="26" fill="#991B1B" font-size="16" font-weight="800" text-anchor="middle" class="font-sans">
      COMUNICAR CONTENTOR CHEIO OU OCORRÊNCIA DE LIXO
    </text>
  </g>

  <!-- Left Column: Instructions -->
  <g transform="translate(60, 260)" class="font-sans">
    
    <!-- Step 1 -->
    <g transform="translate(0, 0)">
      <circle cx="20" cy="20" r="18" fill="#A61413" />
      <text x="20" y="26" fill="#FFFFFF" font-size="16" font-weight="bold" text-anchor="middle">1</text>
      <text x="50" y="16" fill="#0F172A" font-size="15" font-weight="bold">Aponte a câmara do telemóvel</text>
      <text x="50" y="34" fill="#64748B" font-size="12">Abra a câmara ou leitor e aponte para o código QR</text>
    </g>

    <!-- Step 2 -->
    <g transform="translate(0, 60)">
      <circle cx="20" cy="20" r="18" fill="#A61413" />
      <text x="20" y="26" fill="#FFFFFF" font-size="16" font-weight="bold" text-anchor="middle">2</text>
      <text x="50" y="16" fill="#0F172A" font-size="15" font-weight="bold">Indique a situação do local</text>
      <text x="50" y="34" fill="#64748B" font-size="12">Contentor cheio, lamas, vala obstruída ou entulho</text>
    </g>

    <!-- Step 3 -->
    <g transform="translate(0, 120)">
      <circle cx="20" cy="20" r="18" fill="#A61413" />
      <text x="20" y="26" fill="#FFFFFF" font-size="16" font-weight="bold" text-anchor="middle">3</text>
      <text x="50" y="16" fill="#0F172A" font-size="15" font-weight="bold">Acompanhe pelo protocolo</text>
      <text x="50" y="34" fill="#64748B" font-size="12">A equipa de Ondjiva recebe e resolve o chamado</text>
    </g>

    <!-- Alternative SMS Banner -->
    <g transform="translate(0, 185)">
      <rect x="0" y="0" width="410" height="60" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" />
      <text x="16" y="24" fill="#334155" font-size="12" font-weight="bold">Sem internet no telemóvel? Envie SMS:</text>
      <text x="16" y="44" fill="#0F172A" font-size="13" font-weight="800">ONDJIVA [Bairro] [Problema] para 927 855 626</text>
    </g>
  </g>

  <!-- Right Column: High Quality Scannable QR Code Frame -->
  <g transform="translate(510, 250)">
    <rect x="0" y="0" width="230" height="230" rx="16" fill="#FFFFFF" stroke="#A61413" stroke-width="3" filter="url(#shadow)" />
    
    <!-- QR Finder Pattern: Top-Left -->
    <rect x="25" y="25" width="50" height="50" fill="#0F172A" rx="4" />
    <rect x="33" y="33" width="34" height="34" fill="#FFFFFF" rx="2" />
    <rect x="41" y="41" width="18" height="18" fill="#A61413" rx="1" />

    <!-- QR Finder Pattern: Top-Right -->
    <rect x="155" y="25" width="50" height="50" fill="#0F172A" rx="4" />
    <rect x="163" y="33" width="34" height="34" fill="#FFFFFF" rx="2" />
    <rect x="171" y="41" width="18" height="18" fill="#A61413" rx="1" />

    <!-- QR Finder Pattern: Bottom-Left -->
    <rect x="25" y="155" width="50" height="50" fill="#0F172A" rx="4" />
    <rect x="33" y="163" width="34" height="34" fill="#FFFFFF" rx="2" />
    <rect x="41" y="171" width="18" height="18" fill="#A61413" rx="1" />

    <!-- QR Code Data Matrix Pattern Simulation -->
    <g fill="#0F172A">
      <!-- Row 1 -->
      <rect x="85" y="30" width="8" height="8" />
      <rect x="100" y="30" width="16" height="8" />
      <rect x="125" y="30" width="8" height="8" />
      <rect x="138" y="30" width="8" height="8" />

      <!-- Row 2 -->
      <rect x="85" y="45" width="16" height="8" />
      <rect x="110" y="45" width="8" height="8" />
      <rect x="130" y="45" width="16" height="8" />

      <!-- Row 3 -->
      <rect x="90" y="60" width="8" height="8" />
      <rect x="105" y="60" width="16" height="8" />
      <rect x="135" y="60" width="8" height="8" />

      <!-- Middle Belt -->
      <rect x="30" y="85" width="8" height="8" />
      <rect x="50" y="85" width="16" height="8" />
      <rect x="75" y="85" width="8" height="8" />
      <rect x="95" y="85" width="40" height="8" />
      <rect x="145" y="85" width="16" height="8" />
      <rect x="170" y="85" width="8" height="8" />
      <rect x="190" y="85" width="16" height="8" />

      <!-- Center Logo Box in QR -->
      <rect x="90" y="95" width="50" height="40" rx="8" fill="#A61413" />
      <circle cx="106" cy="115" r="9" fill="none" stroke="#FFFFFF" stroke-width="3.5" />
      <path d="M 118 107 L 128 123 M 127 114 L 118 123" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />

      <!-- Lower Belt -->
      <rect x="30" y="135" width="16" height="8" />
      <rect x="60" y="135" width="8" height="8" />
      <rect x="85" y="145" width="16" height="8" />
      <rect x="110" y="145" width="30" height="8" />
      <rect x="150" y="135" width="20" height="8" />
      <rect x="180" y="145" width="16" height="8" />

      <!-- Bottom Right area -->
      <rect x="90" y="165" width="20" height="8" />
      <rect x="120" y="165" width="8" height="8" />
      <rect x="140" y="165" width="16" height="8" />
      <rect x="170" y="165" width="30" height="8" />

      <rect x="85" y="185" width="8" height="8" />
      <rect x="105" y="185" width="24" height="8" />
      <rect x="140" y="185" width="16" height="8" />
      <rect x="165" y="185" width="8" height="8" />
      <rect x="185" y="185" width="16" height="8" />

      <rect x="95" y="200" width="16" height="8" />
      <rect x="120" y="200" width="25" height="8" />
      <rect x="155" y="200" width="15" height="8" />
      <rect x="180" y="200" width="20" height="8" />
    </g>

    <!-- Scan text underneath QR -->
    <text x="115" y="248" fill="#A61413" font-size="12" font-weight="800" text-anchor="middle" class="font-sans">
      www.ombalakisul.com/qr
    </text>
  </g>

  <!-- Bottom Regulatory Bar -->
  <g transform="translate(60, 535)" class="font-sans">
    <line x1="0" y1="0" x2="680" y2="0" stroke="#E2E8F0" stroke-width="1.5" />
    <text x="0" y="22" fill="#64748B" font-size="11" font-weight="600">
      OMBALA KISUL — LDA • NIF: 5000597244 • Ondjiva, Cuanhama, Cunene
    </text>
    <text x="680" y="22" fill="#991B1B" font-size="11" font-weight="bold" text-anchor="end">
      Apoio ao Munícipe: +244 927 855 626
    </text>
  </g>
</svg>
